# ──────────────────────────────────────────────────────────────────────────────
# Q9 – CI/CD Pipeline (GitHub Actions)
# Runs on every push to main and on every pull request.
#
# Steps:
#   1. Set up the Django Poll App
#   2. Run the linter (Q1)
#   3. Run unit tests (Q3)
#   4. Run integration tests (Q7)
#   5. Run performance tests (Q4) – k6 smoke/sanity only (no live server in CI)
#   6. Run UI automation (Q5) – Playwright against the dev server
#
# The pipeline FAILS on lint errors or any test failure.
# ──────────────────────────────────────────────────────────────────────────────

name: Django Poll App – QA Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DJANGO_SETTINGS_MODULE: pollme.settings
  BASE_URL: http://127.0.0.1:8000
  TEST_ADMIN_USER: admin
  TEST_ADMIN_PASS: admin

jobs:
  # Job 1: Lint (Q1)
  lint:
    name: "Q1 – Lint (flake8)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: pip install flake8 flake8-bugbear

      - name: Run flake8 on app source
        # Fails the pipeline on any lint error
        run: flake8 app/ --config .flake8

  # Job 2: Unit + Integration tests (Q3 + Q7)
  test:
    name: "Q3/Q7 – Unit & Integration Tests"
    runs-on: ubuntu-latest
    needs: lint

    services:
      # SQLite is used by default; no external DB service required

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r app/requirements.txt

      - name: Apply Django migrations
        working-directory: app
        run: python manage.py migrate --run-syncdb

      - name: Create Django superuser for tests
        working-directory: app
        run: |
          python manage.py shell -c "
          from django.contrib.auth.models import User
          if not User.objects.filter(username='admin').exists():
              User.objects.create_superuser('admin', 'admin@test.com', 'admin')
          "

      - name: Run unit tests (Q3)
        run: |
          pytest tests/unit/ -v --tb=short -m unit \
            --cov=polls.models --cov-report=term --cov-report=html:htmlcov

      - name: Run integration tests (Q7)
        run: |
          pytest tests/integration/ -v --tb=short -m integration

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

  # Job 3: UI Automation – Playwright (Q5)
  ui-tests:
    name: "Q5 – UI Automation (Playwright)"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r app/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Apply Django migrations & seed data
        working-directory: app
        run: |
          python manage.py migrate --run-syncdb
          python manage.py shell -c "
          from django.contrib.auth.models import User
          if not User.objects.filter(username='admin').exists():
              User.objects.create_superuser('admin', 'admin@test.com', 'admin')
          "

      - name: Start Django dev server (background)
        working-directory: app
        run: |
          python manage.py runserver 127.0.0.1:8000 &
          sleep 3   # give the server a moment to start

      - name: Run Playwright UI tests (Q5)
        run: |
          pytest tests/ui/playwright/ -v --tb=short -m ui \
            --screenshot=only-on-failure --output=screenshots/

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: screenshots/

  # Job 4: Performance test smoke check (Q4)
  # Runs k6 in validate-only mode (--dry-run) so CI doesn't need a live server.
  # For full performance results run the scripts locally against a live instance.
  performance:
    name: "Q4 – Performance Script Validation (k6 dry-run)"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] \
            https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Validate k6 load test script
        run: k6 inspect performance/loadtest.js

      - name: Validate k6 spike test script
        run: k6 inspect performance/spiketest.js
