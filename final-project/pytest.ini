[pytest]
# Point pytest-django at the project settings module
DJANGO_SETTINGS_MODULE = pollme.settings

# Add app/ to sys.path so 'pollme' and 'polls' packages are importable
pythonpath = app

# Where to discover tests
testpaths =
    tests

# Verbose output + short tracebacks
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:base_url

# Custom markers used across the suite
markers =
    unit:        Unit tests (model logic; some use test DB, some use doubles)
    integration: Integration tests (uses test DB)
    ui:          End-to-end Playwright UI tests
    performance: Performance test helpers
