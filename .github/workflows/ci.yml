# ──────────────────────────────────────────────────────────────────────────────
# Q9 – CI/CD Pipeline (GitHub Actions)
# Runs on every push to main and on every pull request.
#
# NOTE: All jobs set `defaults: run: working-directory: final-project` so that
# run: steps can reference paths relative to the final-project/ folder.
# ──────────────────────────────────────────────────────────────────────────────

name: Django Poll App – QA Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DJANGO_SETTINGS_MODULE: pollme.settings
  BASE_URL: http://127.0.0.1:8000
  TEST_ADMIN_USER: admin
  TEST_ADMIN_PASS: admin

jobs:
  # ── Job 1: Lint (Q1) ────────────────────────────────────────────────────────
  lint:
    name: "Q1 – Lint (flake8)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final-project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: pip install flake8 flake8-bugbear

      - name: Run flake8 on app source
        run: flake8 app/ --config .flake8

  # ── Job 2: Unit + Integration tests (Q3 + Q7) ───────────────────────────────
  test:
    name: "Q3/Q7 – Unit & Integration Tests"
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: final-project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r app/requirements.txt

      - name: Apply Django migrations
        working-directory: final-project/app
        run: python manage.py migrate --run-syncdb

      - name: Run unit tests (Q3)
        run: |
          pytest tests/unit/ -v --tb=short \
            --cov=polls.models --cov-report=term --cov-report=html:htmlcov

      - name: Run integration tests (Q7)
        run: pytest tests/integration/ -v --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: final-project/htmlcov/

  # ── Job 3: UI Automation – Playwright (Q5) ──────────────────────────────────
  ui-tests:
    name: "Q5 – UI Automation (Playwright)"
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: final-project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r app/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Apply migrations & create admin user
        working-directory: final-project/app
        run: |
          python manage.py migrate --run-syncdb
          python manage.py shell -c "
          from django.contrib.auth.models import User
          if not User.objects.filter(username='admin').exists():
              User.objects.create_superuser('admin', 'admin@test.com', 'admin')
          "

      - name: Start Django dev server (background)
        working-directory: final-project/app
        run: |
          python manage.py runserver 127.0.0.1:8000 &
          sleep 3

      - name: Run Playwright UI tests (Q5)
        run: pytest tests/ui/playwright/ -v --tb=short --output=screenshots/

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: final-project/screenshots/

  # ── Job 4: Performance script validation (Q4) ───────────────────────────────
  performance:
    name: "Q4 – Performance Script Validation (k6 dry-run)"
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: final-project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install k6
        working-directory: .
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] \
            https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Validate k6 load test script
        run: k6 inspect performance/loadtest.js

      - name: Validate k6 spike test script
        run: k6 inspect performance/spiketest.js
